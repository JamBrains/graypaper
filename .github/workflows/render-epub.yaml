name: Render EPUB

on:
  workflow_dispatch:
  push:
    branches: ["epub-export"]

jobs:
  build_epub:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Configure plain white background and black logo
        run: |
          rm -f style/bg.tex style/logo.tex
          cp style/bg_white_plain.tex style/bg.tex
          cp style/logo_black_font.tex style/logo.tex

      - name: Patch source for tex4ht (EPUB build only)
        # These patches apply to the checked-out copy only; the committed source
        # and the PDF build are untouched.
        #
        # 1. The preamble redefines \left/\right with a \bgroup ... \aftergroup
        #    \egroup spacing trick whose grouping leaks across math boundaries
        #    when tex4ht processes inline math. Comment the redefinitions so
        #    \left/\right stay as the tex4ht-safe originals (the \let captures on
        #    the preceding lines remain intact). Cosmetic only for image math.
        #
        # 2. The body is wrapped in \begin{multicols}{2} ... \end{multicols}.
        #    Two columns are meaningless for a reflowable EPUB and put TeX into
        #    two-column mode, which breaks longtable ("not in 1-column mode") and
        #    tex4ht. There are no \columnbreak uses, so simply drop the wrapper.
        run: |
          sed -i '/\\bgroup\\originalleft/ s|^|% EPUB-disabled: |' preamble.tex
          sed -i '/\\aftergroup\\egroup\\originalright/ s|^|% EPUB-disabled: |' preamble.tex
          sed -i '/\\begin{multicols}/ s|^|% EPUB-disabled: |' graypaper.tex
          sed -i '/\\end{multicols}/ s|^|% EPUB-disabled: |' graypaper.tex
          echo "=== patched preamble \left/\right ==="
          grep -nE 'originalleft|originalright' preamble.tex
          echo "=== patched graypaper.tex multicols ==="
          grep -nE 'multicols' graypaper.tex

      - name: Build EPUB (math rendered as SVG)
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          os: debian
          run: |
            gs --version 2>/dev/null && echo "ghostscript present" || echo "ghostscript MISSING"
            dvisvgm --version || true
            tex4ebook -f epub3+dvisvgm_hashes -x -e epub.mk4 graypaper.tex \
              || echo "tex4ebook exited non-zero: $?"
            echo "=== build output ==="
            ls -la graypaper.epub graypaper.html 2>/dev/null || true
            echo "=== dvisvgm dlog errors ==="
            for f in graypaper*.dlog; do
              echo "--- $f ---"
              grep -iE "error|warning|not found|ghostscript|postscript|special|exception|cannot|failed|processing page" "$f" | head -25 || true
            done 2>/dev/null || true

      - name: Upload EPUB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graypaper-epub
          path: graypaper.epub
          if-no-files-found: warn

      - name: Upload build debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epub-build-debug
          path: |
            graypaper.log
            graypaper.html
            graypaper*.css
          if-no-files-found: warn
